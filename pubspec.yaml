name: headmouse_pro
description: >-
  Aplicación de gestión del HeadMouse Pro: configuración y calibración del
  dispositivo por Bluetooth LE, fichas clínicas, vínculos cuidador-paciente y
  administración sobre Firebase.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_blue_plus: ^2.3.15
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  file_picker: ^13.3.3
  path_provider: ^2.1.6
  open_filex: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/headmouse-logo.jpeg

  # Fuentes incluidas en la app (licencia OFL) para que se vean igual sin
  # conexión a internet.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500

# Ícono de la app: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    background_color: "#020915"
    theme_color: "#020915"
  windows:
    generate: true
    icon_size: 256
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#020915"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png

# Pantalla de inicio: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#000000"
  image: assets/icon/splash.png
  fullscreen: true
  android_12:
    color: "#020915"
    image: assets/icon/app_icon_foreground.png
    icon_background_color: "#020915"
